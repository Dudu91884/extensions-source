name: Build God of Death Extension

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/id/shinigami/**'

jobs:
  build:
    name: Build Extension APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Auto Format Code with Spotless
        run: ./gradlew :src:id:shinigami:spotlessApply

      - name: Build APK God of Death
        run: ./gradlew :src:id:shinigami:assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodOfDeath-APK
          path: '**/*.apk'
